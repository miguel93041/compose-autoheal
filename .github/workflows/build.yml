name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the rules against containers that turn unhealthy
        run: sh test/run.sh

      # main publishes :main, a tag v1.2.3 publishes :1.2.3, and every build publishes :sha-<commit>.
      - name: Publish the image
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          tags="--tag $image:sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags --tag $image:${GITHUB_REF_NAME#v}" ;;
            refs/heads/main) tags="$tags --tag $image:main" ;;
          esac
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push $tags \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
